stages:
  - check
  - build
  - deploy

variables:
  IMAGE: docker.mci.dev/darkube/mci/chatbot/phoenix-guide

lint:
  stage: check
  image: docker.mci.dev/node:24-slim
  tags:
    - mci-next
  script:
    - npm config set registry https://repo.mci.dev/artifactory/api/npm/npm
    - npm ci
    - npm run typecheck
    - npm run lint

build:
  stage: build
  image: docker.mci.dev/docker:latest
  tags:
    - mci-next
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  script:
    - IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - >-
      buildctl --addr "$BUILD_HOST" build
      --frontend dockerfile.v0
      --local context=.
      --local dockerfile=.
      --opt filename=Dockerfile
      --output "type=image,name=$IMAGE:$IMAGE_TAG,push=true"

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        IMAGE_TAG: $CI_COMMIT_TAG
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  trigger:
    project: chatbot/chatbot-ops
    branch: main
    strategy: depend
  variables:
    APP_NAME: phoenix-guide
    CHART_YAML_PATH: dev/phoenix-guide/values.yaml
    CHART_YAML_KEY: app
    ENV: dev
