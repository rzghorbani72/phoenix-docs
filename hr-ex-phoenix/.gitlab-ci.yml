stages:
- build
- deploy

variables:
  IMAGE: docker.mci.dev/darkube/mci/chatbot/phoenix-guide

build:
  stage: build
  image: docker.mci.dev/docker:latest
  tags:
  - mci-next
  rules:
  - if: '$CI_PIPELINE_SOURCE == "push"'
  script:
  - IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
  - >-
    buildctl --addr "$BUILD_HOST" build --frontend dockerfile.v0 --local context=. --local dockerfile=. --opt filename=Dockerfile --export-cache type=registry,ref=$IMAGE:$CI_COMMIT_REF_SLUG --import-cache type=registry,ref=$IMAGE:$CI_COMMIT_REF_SLUG --output "type=image,name=$IMAGE:$IMAGE_TAG,push=true"
